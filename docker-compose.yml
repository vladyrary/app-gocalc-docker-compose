version: "3.8"

services:
  db:
    image: postgres:10
    environment:
      POSTGRES_PASSWORD: pass
      POSTGRES_USER: root
    volumes:
      - db-data:/var/lib/postgresql/data
    networks:
      - gocalc-net

  gocalc:
    image: gocalc:latest
    environment:
      - POSTGRES_URI=postgres://root:pass@db:5432/postgres?sslmode=disable
      - LISTEN_ADDRESS=:7000
    depends_on:
      - db
    networks:
      - gocalc-net

  nginx:
    image: nginx:stable
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "80:80"
    depends_on:
      - gocalc
    networks:
      - gocalc-net

volumes:
  db-data:

networks:
  gocalc-net:

